; =====================================================================
;  OBD2 ESP32 CYD -- เฟิร์มแวร์เกจ OBD-II บนบอร์ด ESP32-2432S028 (CYD)
;
;  จอ TFT (TFT_eSPI) + จอสัมผัส XPT2046 (อ่านเองผ่าน SPI ไม่ใช้ไลบรารี) + Bluetooth Classic + WiFi/เว็บ
;  ตัวจำลอง ELM327 สำหรับทดสอบโดยไม่ต้องใช้รถ เป็นอีกโปรเจกต์ในโฟลเดอร์ simulator/
;
;  เลือกชิปจอให้ตรงกับบอร์ด (ดู README หัวข้อ "เลือกชิปจอ"):
;    env:cyd_ILI9341          จอ ILI9341  (บอร์ด micro-USB รุ่นเดิม)          <- ค่าเริ่มต้น
;    env:cyd_st7789   จอ ST7789   (บอร์ด USB-C / 2 พอร์ต, จอ TPM408-2.8)
;  เลือก env ผิด = ภาพเลื่อน/ขาดครึ่งจอ (แก้ตอนใช้งานไม่ได้ ต้อง build ใหม่ด้วย env ที่ถูก)
;  สีกลับ / แดงสลับน้ำเงิน / ภาพกลับหัว ไม่ต้องแก้ไฟล์นี้: ปรับได้บนจอที่หน้า SET หัวข้อ Display (จำค่าถาวร)
; =====================================================================

[platformio]
default_envs = cyd_ILI9341

[common]
platform = espressif32@7.0.1   ; ล็อกเวอร์ชัน (Arduino core 2.0.17) ทุกเครื่อง build ได้ผลเหมือนกัน; core 3.x เปลี่ยน API ของ LEDC
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv   ; Bluetooth Classic (Bluedroid) ทำให้โปรแกรมใหญ่เกินพาร์ทิชันปกติ
build_flags_common =
  ; ---- จอ TFT: pin (ต้องตรงกับ include/board_config.h) ----
  -D USER_SETUP_LOADED
  -D USE_HSPI_PORT
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT7
  ; ฟอนต์ smooth (anti-aliased) จาก include/ui_fonts.h (Chakra Petch รวมภาษาไทย)
  -D SMOOTH_FONT
  -D SPI_FREQUENCY=40000000        ; ทดสอบแล้วบนบอร์ดจริง (ภาพมีจุดสุ่ม/เส้นขยะ = ลดลงอีก)
  -D SPI_READ_FREQUENCY=20000000
  ; จอสัมผัสอ่านเองผ่าน SPI (ไม่ใช้ TOUCH_CS ของ TFT_eSPI): ปิดคำเตือนของไลบรารีเรื่องนี้
  -D DISABLE_ALL_LIBRARY_WARNINGS
  -Iinclude
  -std=gnu++17
lib_deps =
  bodmer/TFT_eSPI@2.5.43

; ---- จอ ILI9341 (CYD รุ่นเดิม micro-USB) ----
[env:cyd_ILI9341]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags_common}
  -D ILI9341_DRIVER

; ---- จอ ST7789 (CYD รุ่น USB-C / 2 พอร์ต, จอ TPM408-2.8) ----
[env:cyd_st7789]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
  ${common.build_flags_common}
  -D ST7789_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_RGB_ORDER=0
  -D TFT_INVERSION_OFF
